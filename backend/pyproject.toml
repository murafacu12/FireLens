[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "firelens-backend"
version = "0.1.0"
description = "FireLens API: harmonized MODIS/VIIRS fire detections, events, alerts and risk."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.36",
    # vectorized spatial matching in the MODIS vs VIIRS comparison (app/services/sensor_compare.py)
    "numpy>=2.0",
    "scipy>=1.13",
    # land cover (ESA WorldCover) and elevation (Copernicus DEM) from their public GeoTIFFs (app/services/geodata.py)
    "rasterio>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]
# Windows desktop app (desktop/build.ps1): FIRELENS.exe and its icon
desktop = ["pyinstaller>=6.16", "pillow>=11"]
# fire-danger model: training (backend/ml) and inference in /api/risk
ml = ["scikit-learn>=1.5", "numpy>=2.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
